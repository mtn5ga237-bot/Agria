{% extends "base.html" %}
{% block titre %}Confirmer la suppression{% endblock %}
{% block content %}
<div class="container" style="max-width: 480px;">
    <div class="card border-danger shadow-sm">
        <div class="card-body">
            <h1 class="h5">Confirmer la suppression</h1>
            <p>Etes-vous sur de vouloir supprimer <strong>{{ object }}</strong> ? Cette action est irreversible.</p>
            <form method="post">
                {% csrf_token %}
                <a href="{{ request.META.HTTP_REFERER|default:'/' }}" class="btn btn-secondary">Annuler</a>
                <button type="submit" class="btn btn-danger">Supprimer definitivement</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
