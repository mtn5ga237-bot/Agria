{% extends "base_public.html" %}
{% block titre %}Mot de passe modifie{% endblock %}
{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-lg-5 col-md-7">
            <div class="glass-card p-4 p-md-5 text-center reveal">
                <div class="display-4 mb-3"><i class="bi bi-check-circle text-success"></i></div>
                <h1 class="h4 font-heading mb-2">Mot de passe reinitialise</h1>
                <p class="text-muted">Vous pouvez desormais vous connecter avec votre nouveau mot de passe.</p>
                <a href="{% url 'comptes:connexion' %}" class="btn btn-success mt-2">Se connecter</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
